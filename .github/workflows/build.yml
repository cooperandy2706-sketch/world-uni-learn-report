name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*' # Trigger the workflow when a version tag is pushed (e.g., v1.0.0)
  workflow_dispatch: # Allow running the workflow manually from the GitHub Actions UI

jobs:
  build:
    strategy:
      matrix:
        # Build on both Windows and macOS cloud servers
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Windows App
        if: matrix.os == 'windows-latest'
        run: npm run electron:build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed for electron-updater to publish to Releases

      - name: Build macOS App
        if: matrix.os == 'macos-latest'
        run: npm run electron:build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed for electron-updater to publish to Releases

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexora-app-${{ matrix.os }}
          path: |
            dist-electron/*.exe
            dist-electron/*.zip
            dist-electron/*.dmg
